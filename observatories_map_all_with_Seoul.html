const map = L.map('map').setView([39.5, 139.0], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

// Area of interest
L.circleMarker([IMPACT.lat, IMPACT.lon], {
  radius: 10, fillColor: '#c0392b', color: '#fff', weight: 2, fillOpacity: 0.9
}).addTo(map).bindTooltip("Area of interest", {permanent: false, direction: "top"});

// Legend
const legendDiv = document.getElementById('legend');
const ops = [...new Set(stations.map(s => s.operator))].sort();
legendDiv.innerHTML = '<strong>Operators</strong><br>' + 
  ops.map(op => {
    const c = stations.find(s => s.operator === op)?.color || '#333';
    return `<span style="color:${c};">●</span> ${op}`;
  }).join('<br>') + 
  '<br><span style="color:#c0392b;">●</span> Area of interest';

let hoverLine = null;
stations.forEach(s => {
  const marker = L.circleMarker([s.lat, s.lon], {
    radius: 6, fillColor: s.color, color: '#fff', weight: 1, fillOpacity: 0.9
  }).addTo(map);
  
  marker.bindTooltip(s.code, {permanent: false, className: 'station-label', direction: 'top'});
  
  marker.on('click', () => {
    document.getElementById('info').innerHTML = `
      <h3>${s.code} – ${s.station}</h3>
      <p><strong>Operator:</strong> ${s.operator}</p>
      <p><strong>Lat/Lon:</strong> ${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}</p>
      <p><strong>Distance:</strong> ${s.distance || 'n/a'} km</p>
      <p><strong>Start:</strong> ${s.start_year || '–'}</p>
      <p><strong>Notes:</strong> ${s.notes || '–'}</p>
    `;
  });
  
  marker.on('mouseover', () => {
    if (hoverLine) map.removeLayer(hoverLine);
    hoverLine = L.polyline([[s.lat, s.lon], [IMPACT.lat, IMPACT.lon]], {
      color: '#e74c3c', weight: 2, dashArray: '6,4', opacity: 0.8
    }).addTo(map);
  });
  marker.on('mouseout', () => {
    if (hoverLine) { map.removeLayer(hoverLine); hoverLine = null; }
  });
});
