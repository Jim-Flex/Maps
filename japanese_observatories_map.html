const map = L.map('map', { zoomControl: true }).setView([39.5, 140.5], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

// Area of interest marker
const impactMarker = L.circleMarker([IMPACT.lat, IMPACT.lon], {
  radius: 8,
  fillColor: '#c0392b',
  color: '#922b21',
  weight: 2,
  fillOpacity: 0.9
}).addTo(map);
impactMarker.bindTooltip('Area of interest', {
  permanent: true,
  direction: 'top',
  offset: [0, -10],
  className: 'station-label'
});
impactMarker.bindPopup('<strong>Area of interest</strong><br>39.901°N, 138.604°E');

// Distance line (created on hover)
let distanceLine = null;

const group = L.featureGroup();

allStations.forEach(s => {
  const isJMA = !s.country;
  const color = s.color || '#1f77b4';
  const border = isJMA ? '#1a5276' : (s.country === 'Russia' ? '#6c3483' : '#1e8449');
  const marker = L.circleMarker([s.lat, s.lon], {
    radius: isJMA ? 6 : 7,
    fillColor: color,
    color: border,
    weight: 1.5,
    opacity: 1,
    fillOpacity: 0.85
  });

  const tooltip = L.tooltip({
    permanent: true,
    direction: 'right',
    offset: [8, 0],
    className: 'station-label'
  }).setContent(s.code);

  marker.bindTooltip(tooltip);

  const notesHtml = s.notes ? `<p><strong>Notes:</strong> ${escapeHtml(s.notes)}</p>` : '<p class="muted">No notes</p>';
  const popupHtml = `
    <div style="min-width:180px;font-size:13px;">
      <strong style="font-size:15px;color:#1a5276;">${escapeHtml(s.station)} (${s.code})</strong><br>
      <p><strong>Distance:</strong> ${s.distance} km</p>
      <p><strong>Lat / Lon:</strong> ${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}</p>
      <p><strong>Start year:</strong> ${escapeHtml(s.start_year)}</p>
      ${notesHtml}
    </div>
  `;
  marker.bindPopup(popupHtml);

  // Hover: draw line to target
  marker.on('mouseover', () => {
    if (distanceLine) map.removeLayer(distanceLine);
    distanceLine = L.polyline(
      [[s.lat, s.lon], [IMPACT.lat, IMPACT.lon]],
      { color: '#e74c3c', weight: 2, dashArray: '6, 6', opacity: 0.85 }
    ).addTo(map);
    distanceLine.bindTooltip(`${s.distance} km`, {
      permanent: false,
      direction: 'center',
      className: 'station-label'
    }).openTooltip();
  });

  marker.on('mouseout', () => {
    if (distanceLine) {
      map.removeLayer(distanceLine);
      distanceLine = null;
    }
  });

  marker.on('click', () => {
    document.getElementById('info').innerHTML = `
      <h3>${escapeHtml(s.station)} <span style="font-weight:400;">(${s.code})</span></h3>
      <p><strong>Distance from area of interest:</strong> ${s.distance} km</p>
      <p><strong>Latitude:</strong> ${s.lat.toFixed(5)}</p>
      <p><strong>Longitude:</strong> ${s.lon.toFixed(5)}</p>
      <p><strong>Start year:</strong> ${escapeHtml(s.start_year)}</p>
      ${notesHtml}
    `;
  });

  marker.addTo(group);
});

group.addTo(map);
map.fitBounds(group.getBounds().pad(0.08));

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
}
